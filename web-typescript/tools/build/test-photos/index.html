<!doctype html>
<html><head><meta charset="utf-8"><style>html,body{margin:0;background:#eef2f6}canvas{display:block}</style></head>
<body>
<script type="importmap">{"imports":{"three":"./three/build/three.module.js","three/addons/":"./three/examples/jsm/"}}</script>
<script type="module">
// 1장 수행평가 사진: 같은 배경 · 같은 각도 · 같은 크기, 한 가지 회색(로고 · 회사 색 없이)
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
const q = new URLSearchParams(location.search);
const W = 1100, H = 700;
const r = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
r.setSize(W, H); r.setPixelRatio(1);
r.shadowMap.enabled = true; r.shadowMap.type = THREE.PCFSoftShadowMap;
r.toneMapping = THREE.ACESFilmicToneMapping; r.toneMappingExposure = 0.85;
document.body.appendChild(r.domElement);
const s = new THREE.Scene();
s.background = new THREE.Color('#eef2f6');
s.environment = new THREE.PMREMGenerator(r).fromScene(new RoomEnvironment(), 0.04).texture;
s.environmentIntensity = 0.6;
const gl = new GLTFLoader();
const dr = new DRACOLoader(); dr.setDecoderPath('./draco/'); gl.setDRACOLoader(dr);
const g = (await gl.loadAsync(q.get('m') + '.glb')).scene;
const zup = q.get('zup') !== '0';
const holder = new THREE.Group();
if (zup) holder.rotation.x = -Math.PI / 2;           // Z-up robot files → three's Y-up
holder.add(g);
const yawG = new THREE.Group();
yawG.rotation.y = THREE.MathUtils.degToRad(Number(q.get('yaw') || 0));
yawG.add(holder);
s.add(yawG);
const clay = new THREE.MeshStandardMaterial({ color: '#a7b0bb', roughness: 0.5, metalness: 0.0 });
g.traverse((o) => { if (o.isMesh) { o.material = clay; o.castShadow = true; o.receiveShadow = true; } });
// stand it on the floor, centred
let box = new THREE.Box3().setFromObject(yawG);
yawG.position.y -= box.min.y;
box = new THREE.Box3().setFromObject(yawG);
const c = box.getCenter(new THREE.Vector3());
yawG.position.x -= c.x; yawG.position.z -= c.z;
box = new THREE.Box3().setFromObject(yawG);
const size = box.getSize(new THREE.Vector3());
const floor = new THREE.Mesh(new THREE.PlaneGeometry(50, 50), new THREE.ShadowMaterial({ opacity: 0.18 }));
floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; s.add(floor);
const key = new THREE.DirectionalLight('#ffffff', 1.6);
const R0 = Math.max(size.x, size.y, size.z);
key.position.set(R0 * 1.2, R0 * 3, R0 * 1.6); key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
Object.assign(key.shadow.camera, { left: -R0 * 2, right: R0 * 2, top: R0 * 2, bottom: -R0 * 2, near: 0.01, far: R0 * 10 });
s.add(key);
// the same camera for every robot: 3/4 from the front, 18° above; the robot fills 78 % of the height (or 80 % of the width)
// (el · az: one robot may need its own view to be recognised — the drone from the side, 파트 18 검수)
const fov = 30, el = THREE.MathUtils.degToRad(Number(q.get('el') ?? 18)), az = THREE.MathUtils.degToRad(Number(q.get('az') ?? 35));
const cam = new THREE.PerspectiveCamera(fov, W / H, 0.01, 100);
const target = new THREE.Vector3(0, size.y / 2, 0);
const dir = new THREE.Vector3(Math.sin(az) * Math.cos(el), Math.sin(el), Math.cos(az) * Math.cos(el));
let dist = 1;
const up = new THREE.Vector3(0, 1, 0);
for (let k = 0; k < 10; k++) {
  cam.position.copy(target).addScaledVector(dir, dist); cam.lookAt(target); cam.updateMatrixWorld();
  const pts = []; const b = box;
  for (const x of [b.min.x, b.max.x]) for (const y of [b.min.y, b.max.y]) for (const z of [b.min.z, b.max.z]) pts.push(new THREE.Vector3(x, y, z).project(cam));
  const xs = pts.map((p) => p.x), ys = pts.map((p) => p.y);
  const w = (Math.max(...xs) - Math.min(...xs)) / 2, h = (Math.max(...ys) - Math.min(...ys)) / 2;
  const cx = (Math.max(...xs) + Math.min(...xs)) / 2, cy = (Math.max(...ys) + Math.min(...ys)) / 2;
  // move the target so the box is centred in the picture
  const halfH = dist * Math.tan(THREE.MathUtils.degToRad(fov / 2)), halfW = halfH * (W / H);
  const right = new THREE.Vector3().setFromMatrixColumn(cam.matrixWorld, 0), camUp = new THREE.Vector3().setFromMatrixColumn(cam.matrixWorld, 1);
  target.addScaledVector(right, cx * halfW).addScaledVector(camUp, cy * halfH);
  dist *= Math.max(w / 0.80, h / 0.78);
}
cam.position.copy(target).addScaledVector(dir, dist); cam.lookAt(target);
r.render(s, cam);
window.png = r.domElement.toDataURL('image/png');
cam.updateMatrixWorld();
const P = []; for (const x of [box.min.x, box.max.x]) for (const y of [box.min.y, box.max.y]) for (const z of [box.min.z, box.max.z]) P.push(new THREE.Vector3(x, y, z).project(cam));
window.info = { size: size.toArray().map((v) => Math.round(v * 1000)), ndc: [Math.min(...P.map((p) => p.x)), Math.max(...P.map((p) => p.x)), Math.min(...P.map((p) => p.y)), Math.max(...P.map((p) => p.y))].map((v) => +v.toFixed(2)), dist: +dist.toFixed(2) };
</script></body></html>
