# 로봇 설치 도구 묶기: release 브랜치에 올린 두 파일(설치 도구 zip · 로봇 키트 zip, 각각 100 MB 아래)을
# PhysicalAI-RobotTool.zip 하나로 합쳐 GitHub 릴리스에 올려요 (릴리스 파일은 2 GB 까지).
# 웹 사이트 자료실 › 프로그램의 [받기] 가 늘 같은 주소를 써요:
#   https://github.com/KwonJungHyeock/physical-ai-lab/releases/latest/download/PhysicalAI-RobotTool.zip
# 로봇 키트만 따로:
#   https://github.com/KwonJungHyeock/physical-ai-lab/releases/latest/download/eduino_usb.zip
# 도구 zip 은 파일이 맨 위에 있어 [압축 풀기] 하면 폴더 한 겹, 그 옆의 eduino_usb.zip 을 도구가 찾아 써요.
# 시뮬레이터는 웹 사이트예요 (시뮬레이터 exe 는 릴리스에 올리지 않아요).
name: 로봇 설치 도구 묶기

on:
  push:
    branches: [release]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 설치 도구 + 로봇 키트를 zip 하나로
        run: |
          mkdir -p out
          cp PhysicalAI-RobotTool.zip out/PhysicalAI-RobotTool.zip
          cp eduino_usb.zip out/eduino_usb.zip
          # 이미 압축된 키트라 그대로(-0) 맨 위에(-j) 넣어요.
          zip -0 -j -q out/PhysicalAI-RobotTool.zip eduino_usb.zip
          unzip -l out/PhysicalAI-RobotTool.zip
          sha256sum out/PhysicalAI-RobotTool.zip | tee out/sha256.txt
      - name: 릴리스에 올리기 (늘 같은 주소)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="tool-$(date -u +%Y%m%d-%H%M)"
          sed -n '1,/^## 지난 판/p' README.md | sed '$d' > out/notes.md
          printf '\n확인값 (SHA-256): `%s`\n' "$(cut -d' ' -f1 out/sha256.txt)" >> out/notes.md
          gh release create "$tag" out/PhysicalAI-RobotTool.zip out/eduino_usb.zip --target "$GITHUB_SHA" --title "Physical AI 로봇 설치 도구 ($tag)" --notes-file out/notes.md --latest
